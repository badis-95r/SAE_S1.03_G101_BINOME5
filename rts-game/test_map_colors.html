<!DOCTYPE html>
<html>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const img = new Image();
        img.onload = () => {
            const canvas = document.getElementById('canvas');
            canvas.width = 100;
            canvas.height = 100;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 100, 100);
            const data = ctx.getImageData(0, 0, 100, 100).data;

            let countDark = 0;
            let countLight = 0;
            let countTransparent = 0;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i+1];
                const b = data[i+2];
                const a = data[i+3];

                if (a < 128) {
                    countTransparent++;
                } else {
                    const avg = (r + g + b) / 3;
                    if (avg < 128) {
                        countDark++;
                    } else {
                        countLight++;
                    }
                }
            }
            console.log(JSON.stringify({
                dark: countDark,
                light: countLight,
                transparent: countTransparent,
                total: data.length / 4
            }));

            // Expose for Playwright
            window.colorStats = {
                dark: countDark,
                light: countLight,
                transparent: countTransparent,
                total: data.length / 4
            };
        };
        img.src = "map.png";
    </script>
</body>
</html>
